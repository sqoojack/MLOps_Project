data:
    processed_train_path: "data/processed/train.csv"
    processed_test_path: "data/processed/test.csv"
    item_map_path: "artifacts/item_map.json"        # 修改此行
    metadata_path: "artifacts/items_metadata.json"  # 修改此行
    model_path: "artifacts/model.pth"               # 新增此行

    test_size: 0.2
    min_item_count: 20

model:
    type: "gqa"       
    embed_dim: 128
    num_heads: 4     
    num_kv_heads: 1   
    num_layers: 2
    max_len: 20
    dropout: 0.3

train:
    mode: "ec2"
    ec2_ami_id: "ami-0345712df7cf09be1" # Deep Learning OSS Nvidia Driver AMI GPU PyTorch 2.8 (Ubuntu 24.04) 20260321
    # ec2_instance_type: "t3.medium"    # CPU版本
    ec2_instance_type: "g4dn.xlarge"    # 中階GPU
    # ec2_instance_type: "g6.xlarge"  # 更快的GPU
    batch_size: 128
    epochs: 1
    lr: 0.0015
    eval_interval: 1

redis:
    host: "redis" 
    port: 6379
    db: 0
    ttl: 86400

mlflow:
    experiment_name: "Amazon_Beauty_Rec"
    model_name: "RecTransformer_GQA"