services:
    # 1. Redis 服務 (不變)
    redis:
        image: redis:alpine
        ports:
            - "6379:6379"
        networks:
            - mlops_network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 30s
            retries: 50

    # 2. [已移除] data_fix 服務 (由 Airflow + DVC 取代)

    # 3. Airflow Webserver (介面)
    airflow-webserver:
        build:
            context: .
            dockerfile: infrastructure/docker/Dockerfile.airflow
        command: webserver
        ports:
            - "8080:8080"
        user: "${AIRFLOW_UID}:${AIRFLOW_GID}"
        environment:
            - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
            - AIRFLOW__CORE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
            - AIRFLOW__CORE__LOAD_EXAMPLES=False
            
            - AIRFLOW__WEBSERVER__SECRET_KEY=mlops_secret_key_12345

            - _AIRFLOW_DB_UPGRADE=true
            - _AIRFLOW_WWW_USER_CREATE=true
            - _AIRFLOW_WWW_USER_USERNAME=sqoojack
            - _AIRFLOW_WWW_USER_PASSWORD=alicksas
            - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
            - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
            - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
        volumes:
            - ./airflow:/opt/airflow  # 將本地的 airflow/ 資料夾（含 db）掛載進去
            - ./airflow/dags:/opt/airflow/dags  # 掛載 DAG
            - .:/opt/airflow/project            # 掛載整個專案代碼，讓 Airflow 能執行 src/
        networks:
            - mlops_network
        env_file: 
            - .env

    # 4. Airflow Scheduler (核心排程器，負責執行 DVC)
    airflow-scheduler:
        build:
            context: .
            dockerfile: infrastructure/docker/Dockerfile.airflow
        user: "${AIRFLOW_UID}:${AIRFLOW_GID}"
        command: scheduler
        environment:
            - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
            - AIRFLOW__CORE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
            - _AIRFLOW_DB_MIGRATE=true # 使用新的環境變數名稱
            
            - AIRFLOW__WEBSERVER__SECRET_KEY=mlops_secret_key_12345
            - MLFLOW_TRACKING_URI=sqlite:////opt/airflow/project/mlflow.db
            - AIRFLOW__CORE__LOAD_EXAMPLES=False
            - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
            - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
            - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
        volumes:
            - ./airflow:/opt/airflow
            - ./airflow/dags:/opt/airflow/dags
            - .:/opt/airflow/project            # 關鍵：讓 Scheduler 能讀寫你的專案檔案
        networks:
            - mlops_network
        depends_on:
            - airflow-webserver
        env_file: 
            - .env

    # 5. API 服務
    api:
        build: 
            context: .
            dockerfile: infrastructure/docker/Dockerfile.api
        ports:
            - "8000:8000"
        networks:
            - mlops_network
        depends_on:
            redis:
                condition: service_healthy
            # 不需要 data_fix 了，也不需要等 airflow，因為 airflow 是背景執行的
        volumes:
            - ./api:/app/api
            - ./artifacts:/app/artifacts        # 改為掛載資料夾
            - ./params.yaml:/app/params.yaml
            - ./scripts/init_redis.py:/app/init_redis.py
            - ./data/processed:/app/data/processed
        env_file: 
            - .env
            
    # 6. UI 服務 (不變)
    ui:
        build:
            context: .
            dockerfile: infrastructure/docker/Dockerfile.ui
        ports:
            - "8501:8501"
        environment:
            - API_URL=http://api:8000
            - STREAMLIT_SERVER_FILE_WATCHER_TYPE=poll
            - STREAMLIT_SERVER_RUN_ON_SAVE=true
        depends_on:
            - api
        networks:
            - mlops_network
        volumes:
            - ./ui/app.py:/app/app.py

networks:
    mlops_network: