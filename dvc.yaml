stages:
    # 1. 資料處理 (ETL) - 現在包含價格修復
    preprocess:
        cmd: python src/features.py
        deps:
        - src/features.py
        - params.yaml
        - feature/events_processed.csv  # 讓 DVC 追蹤 Redis 萃取出來的最新事件檔
        - data/raw/meta_Beauty.json.gz
        outs:
        - data/processed/train.csv
        - data/processed/test.csv
        - item_map.json
        - items_metadata.json # 確保 features.py 產生這個

    # 2. 訓練 Transformer 模型
    train:
        cmd: python src/train.py
        deps:
        - data/processed/train.csv
        - data/processed/test.csv
        - src/train.py
        - src/model.py
        - params.yaml
        - item_map.json
        outs:
        - model.pth

    # 3. 評估階段
    evaluate:
        cmd: python src/evaluate.py
        deps:
        - src/evaluate.py
        - src/model.py
        - data/processed/test.csv
        - params.yaml
        - model.pth
        - item_map.json
        metrics:
        - metrics.json:
            persist: true
            cache: false