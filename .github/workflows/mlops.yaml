name: MLOps Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          # 僅安裝執行 tests/test_model.py 所需的核心套件，避免在 CI 耗時安裝 sagemaker 等重型依賴
          pip install pytest torch pyyaml

      - name: Run Unit Tests
        run: |
          # 測試模型輸出維度與 Masking 邏輯
          python -m pytest tests/